<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - ObesiTrack</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    .glass-effect { backdrop-filter: blur(10px); background: rgba(255, 255, 255, 0.1); }
  </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center p-4">
  <!-- Background Pattern -->
  <div class="absolute inset-0 overflow-hidden">
    <div class="absolute -top-40 -right-40 w-80 h-80 bg-white opacity-10 rounded-full"></div>
    <div class="absolute -bottom-40 -left-40 w-80 h-80 bg-white opacity-10 rounded-full"></div>
  </div>

  <!-- Login Card -->
  <div class="relative w-full max-w-md">
    <!-- Back to Home Button -->
    <div class="mb-6">
      <a href="/" class="inline-flex items-center text-white hover:text-gray-200 transition duration-300">
        <i class="fas fa-arrow-left mr-2"></i>
        Retour à l'accueil
      </a>
    </div>

    <!-- Main Card -->
    <div class="glass-effect rounded-2xl shadow-2xl p-8 border border-white/20">
      <!-- Logo and Title -->
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-white/20 rounded-full mb-4">
          <i class="fas fa-heartbeat text-2xl text-white"></i>
        </div>
        <h1 class="text-3xl font-bold text-white mb-2">ObesiTrack</h1>
        <p class="text-white/80">Connectez-vous à votre compte</p>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="space-y-6">
        <!-- Email Field -->
        <div>
          <label class="block text-sm font-medium text-white mb-2">
            <i class="fas fa-envelope mr-2"></i>Adresse email
          </label>
          <input 
            type="email" 
            id="email" 
            class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-lg text-white placeholder-white/60 focus:outline-none focus:ring-2 focus:ring-white/50 focus:border-transparent transition duration-300" 
            placeholder="votre@email.com"
            required
          >
        </div>

        <!-- Password Field -->
        <div>
          <label class="block text-sm font-medium text-white mb-2">
            <i class="fas fa-lock mr-2"></i>Mot de passe
          </label>
          <div class="relative">
            <input 
              type="password" 
              id="password" 
              class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-lg text-white placeholder-white/60 focus:outline-none focus:ring-2 focus:ring-white/50 focus:border-transparent transition duration-300 pr-12" 
              placeholder="••••••••"
              required
            >
            <button 
              type="button" 
              onclick="togglePassword()" 
              class="absolute right-3 top-1/2 transform -translate-y-1/2 text-white/60 hover:text-white transition duration-300"
            >
              <i id="passwordIcon" class="fas fa-eye"></i>
            </button>
          </div>
        </div>

        <!-- Remember Me & Forgot Password -->
        <div class="flex items-center justify-between">
          <label class="flex items-center text-white/80">
            <input type="checkbox" class="rounded border-white/20 bg-white/10 text-blue-600 focus:ring-blue-500 focus:ring-offset-0">
            <span class="ml-2 text-sm">Se souvenir de moi</span>
          </label>
          <a href="#" class="text-sm text-white/80 hover:text-white transition duration-300">
            Mot de passe oublié ?
          </a>
        </div>

        <!-- Login Button -->
        <button 
          type="submit" 
          class="w-full bg-white text-blue-600 py-3 px-4 rounded-lg font-semibold hover:bg-gray-100 transition duration-300 transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-white/50"
        >
          <i class="fas fa-sign-in-alt mr-2"></i>
          Se Connecter
        </button>

        <!-- Divider -->
        <div class="relative my-6">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-white/20"></div>
          </div>
          <div class="relative flex justify-center text-sm">
            <span class="px-2 bg-transparent text-white/60">ou</span>
          </div>
        </div>

        <!-- Register Link -->
        <div class="text-center">
          <p class="text-white/80">
            Pas encore de compte ? 
            <a href="/register" class="text-white font-semibold hover:text-gray-200 transition duration-300">
              Créer un compte
            </a>
          </p>
        </div>
      </form>

      <!-- Loading Overlay -->
      <div id="loadingOverlay" class="hidden absolute inset-0 bg-black/50 rounded-2xl flex items-center justify-center">
        <div class="text-center text-white">
          <i class="fas fa-spinner fa-spin text-3xl mb-2"></i>
          <p>Connexion en cours...</p>
        </div>
      </div>
    </div>

    <!-- Features Preview -->
    <div class="mt-8 text-center">
      <p class="text-white/60 text-sm mb-4">Découvrez les fonctionnalités d'ObesiTrack</p>
      <div class="flex justify-center space-x-6 text-white/60">
        <div class="flex items-center">
          <i class="fas fa-brain mr-2"></i>
          <span class="text-sm">IA Avancée</span>
        </div>
        <div class="flex items-center">
          <i class="fas fa-shield-alt mr-2"></i>
          <span class="text-sm">Sécurisé</span>
        </div>
        <div class="flex items-center">
          <i class="fas fa-chart-line mr-2"></i>
          <span class="text-sm">Analytics</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Toggle password visibility
    function togglePassword() {
      const passwordInput = document.getElementById('password');
      const passwordIcon = document.getElementById('passwordIcon');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        passwordIcon.classList.remove('fa-eye');
        passwordIcon.classList.add('fa-eye-slash');
      } else {
        passwordInput.type = 'password';
        passwordIcon.classList.remove('fa-eye-slash');
        passwordIcon.classList.add('fa-eye');
      }
    }

    // Form submission
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const loadingOverlay = document.getElementById('loadingOverlay');
      
      // Show loading
      loadingOverlay.classList.remove('hidden');
      
      try {
        const response = await fetch('http://localhost:7777/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            email: email,
            password: password
          })
        });
        
        const data = await response.json();
        
        if (response.ok) {
          // Store token and user data
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify({
            name: data.name,
            email: data.email
          }));
          
          // Show success message
          showNotification('Connexion réussie !', 'success');
          
          // Redirect to dashboard
          setTimeout(() => {
            window.location.href = '/dashboard';
          }, 1500);
        } else {
          showNotification('Erreur de connexion: ' + data.detail, 'error');
        }
      } catch (error) {
        showNotification('Erreur de connexion: ' + error.message, 'error');
      } finally {
        loadingOverlay.classList.add('hidden');
      }
    });

    // Notification system
    function showNotification(message, type) {
      const notification = document.createElement('div');
      notification.className = `fixed top-4 right-4 p-4 rounded-lg shadow-lg z-50 ${
        type === 'success' ? 'bg-green-500 text-white' : 'bg-red-500 text-white'
      }`;
      notification.innerHTML = `
        <div class="flex items-center">
          <i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'} mr-2"></i>
          <span>${message}</span>
        </div>
      `;
      
      document.body.appendChild(notification);
      
      setTimeout(() => {
        notification.remove();
      }, 5000);
    }

    // Check if user is already logged in
    document.addEventListener('DOMContentLoaded', function() {
      const token = localStorage.getItem('token');
      if (token) {
        window.location.href = '/dashboard';
      }
    });
  </script>
</body>
</html>
