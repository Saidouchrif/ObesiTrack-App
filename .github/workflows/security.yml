name: 🔒 Tests de Sécurité - ObesiTrack

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]
  schedule:
    - cron: '0 2 * * 1'  # Chaque lundi à 2h du matin

env:
  REPO_URL: 'https://github.com/Saidouchrif/ObesiTrack-App.git'

jobs:
  # Analyse de sécurité du code
  code-security:
    name: 🔍 Analyse de Sécurité du Code
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout du code
      uses: actions/checkout@v4
      
    - name: 🐍 Configuration Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: 📦 Installation des dépendances
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety semgrep
        
    - name: 🔍 Analyse avec Bandit
      run: |
        bandit -r App/ ModelAi/ -f json -o bandit-report.json || true
        bandit -r App/ ModelAi/ -ll
        
    - name: 🛡️ Vérification des vulnérabilités avec Safety
      run: |
        safety check --json --output safety-report.json || true
        safety check
        
    - name: 🔬 Analyse avec Semgrep
      run: |
        semgrep --config=auto --json --output=semgrep-report.json . || true
        semgrep --config=auto .
        
    - name: 📊 Upload des rapports de sécurité
      uses: actions/upload-artifact@v3
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json
          semgrep-report.json

  # Analyse des dépendances
  dependency-check:
    name: 📦 Analyse des Dépendances
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout du code
      uses: actions/checkout@v4
      
    - name: 🐍 Configuration Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: 📦 Installation des dépendances
      run: |
        python -m pip install --upgrade pip
        pip install pip-audit
        
    - name: 🔍 Audit des dépendances avec pip-audit
      run: |
        pip-audit --format=json --output=pip-audit-report.json || true
        pip-audit
        
    - name: 📊 Upload du rapport d'audit
      uses: actions/upload-artifact@v3
      with:
        name: dependency-audit-report
        path: pip-audit-report.json

  # Analyse des secrets
  secret-scanning:
    name: 🔐 Détection de Secrets
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout du code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Nécessaire pour l'analyse complète de l'historique
        
    - name: 🔍 Détection de secrets avec TruffleHog
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: main
        head: HEAD
        extra_args: --debug --only-verified

  # Analyse de la configuration Docker
  docker-security:
    name: 🐳 Sécurité Docker
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout du code
      uses: actions/checkout@v4
      
    - name: 🐳 Configuration Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: 🏗️ Construction de l'image
      run: |
        docker build -t obesitrack:security-test .
        
    - name: 🔍 Analyse de sécurité avec Trivy
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'obesitrack:security-test'
        format: 'sarif'
        output: 'trivy-results.sarif'
        
    - name: 📊 Upload des résultats Trivy
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'

  # Tests de pénétration basiques
  penetration-tests:
    name: 🎯 Tests de Pénétration
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout du code
      uses: actions/checkout@v4
      
    - name: 🐍 Configuration Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: 📦 Installation des outils de test
      run: |
        python -m pip install --upgrade pip
        pip install requests pytest
        
    - name: 🎯 Tests de sécurité des endpoints
      run: |
        # Tests basiques de sécurité des endpoints
        python -c "
        import requests
        import sys
        
        # Test des endpoints sans authentification
        endpoints = ['/admin/users', '/admin/results', '/predict']
        base_url = 'http://localhost:7777'
        
        for endpoint in endpoints:
            try:
                response = requests.get(f'{base_url}{endpoint}', timeout=5)
                if response.status_code not in [401, 403]:
                    print(f'⚠️  Endpoint {endpoint} accessible sans authentification')
                    sys.exit(1)
                else:
                    print(f'✅ Endpoint {endpoint} correctement protégé')
            except:
                print(f'ℹ️  Endpoint {endpoint} non accessible (normal en CI)')
        "

  # Rapport de sécurité final
  security-summary:
    name: 📊 Résumé de Sécurité
    runs-on: ubuntu-latest
    needs: [code-security, dependency-check, secret-scanning, docker-security]
    if: always()
    
    steps:
    - name: 📊 Génération du résumé de sécurité
      run: |
        echo "## 🔒 Résumé de Sécurité ObesiTrack" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Repository:** ${{ env.REPO_URL }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Test de Sécurité | Statut |" >> $GITHUB_STEP_SUMMARY
        echo "|------------------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| 🔍 Analyse de Code | ${{ needs.code-security.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| 📦 Dépendances | ${{ needs.dependency-check.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| 🔐 Secrets | ${{ needs.secret-scanning.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| 🐳 Docker | ${{ needs.docker-security.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📋 Recommandations" >> $GITHUB_STEP_SUMMARY
        echo "- Vérifiez régulièrement les mises à jour de sécurité" >> $GITHUB_STEP_SUMMARY
        echo "- Utilisez des secrets pour les informations sensibles" >> $GITHUB_STEP_SUMMARY
        echo "- Maintenez les dépendances à jour" >> $GITHUB_STEP_SUMMARY
        echo "- Surveillez les vulnérabilités dans les images Docker" >> $GITHUB_STEP_SUMMARY