# Configuration Dependabot pour ObesiTrack
# https://github.com/Saidouchrif/ObesiTrack-App.git

version: 2
updates:
  # Mise à jour des dépendances Python
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "Saidouchrif"
    assignees:
      - "Saidouchrif"
    commit-message:
      prefix: "📦"
      include: "scope"
    labels:
      - "dependencies"
      - "python"

  # Mise à jour des actions GitHub
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "Saidouchrif"
    assignees:
      - "Saidouchrif"
    commit-message:
      prefix: "🔧"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"

  # Mise à jour des images Docker
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "Saidouchrif"
    assignees:
      - "Saidouchrif"
    commit-message:
      prefix: "🐳"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"
