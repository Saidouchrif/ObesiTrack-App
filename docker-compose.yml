version: '3.8'

services:
  obesitrack:
    build: .
    container_name: obesitrack-app
    ports:
      - "7777:7777"  # API principale
      - "8000:8000"  # API ML
    environment:
      - PYTHONPATH=/app
      - MONGODB_URL=mongodb://mongo:27017/obesitrack
      - MONGO_URI=mongodb://mongo:27017/obesitrack
      - DB_NAME=obesitrack
      - SECRET_KEY=saidouchrif
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
    depends_on:
      - mongo
    volumes:
      - ./App/Front-end/src:/app/App/Front-end/src:ro  # Montage en lecture seule pour les templates
      - ./App/Front-end/Images:/app/App/Front-end/Images:ro  # Montage des images
    restart: unless-stopped
    networks:
      - obesitrack-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7777/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mongo:
    image: mongo:6.0
    container_name: obesitrack-mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=obesitrack
    volumes:
      - mongo_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    restart: unless-stopped
    networks:
      - obesitrack-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Service optionnel pour MongoDB Express (interface web)
  mongo-express:
    image: mongo-express:1.0.0
    container_name: obesitrack-mongo-express
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=admin123
      - ME_CONFIG_MONGODB_ENABLE_ADMIN=true
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - obesitrack-network

volumes:
  mongo_data:
    driver: local

networks:
  obesitrack-network:
    driver: bridge
