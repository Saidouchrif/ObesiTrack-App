name: 🧪 Tests Automatiques - ObesiTrack

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

env:
  PYTHON_VERSION: '3.11'
  MONGODB_VERSION: '6.0'
  REPO_URL: 'https://github.com/Saidouchrif/ObesiTrack-App.git'

jobs:
  # Tests de linting et formatage
  lint:
    name: 🔍 Linting & Formatage
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout du code
      uses: actions/checkout@v4
      
    - name: 🐍 Configuration Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: 📦 Installation des dépendances de développement
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort mypy
        pip install -r requirements.txt
        
    - name: 🎨 Vérification du formatage avec Black
      run: |
        black --check --diff .
        
    - name: 📋 Vérification des imports avec isort
      run: |
        isort --check-only --diff .
        
    - name: 🔍 Linting avec Flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        
    - name: 🔬 Vérification des types avec MyPy
      run: |
        mypy --ignore-missing-imports App/Back-end/main.py ModelAi/obesity_api.py

  # Tests du backend FastAPI
  backend-tests:
    name: 🏥 Tests Backend
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:${{ env.MONGODB_VERSION }}
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_DATABASE: obesitrack_test
          
    steps:
    - name: 📥 Checkout du code
      uses: actions/checkout@v4
      
    - name: 🐍 Configuration Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: 📦 Installation des dépendances
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio httpx
        
    - name: 🧪 Exécution des tests backend
      run: |
        cd App/Back-end
        python -m pytest tests/ -v --tb=short
      env:
        MONGO_URI: mongodb://localhost:27017/obesitrack_test
        DB_NAME: obesitrack_test
        SECRET_KEY: test_secret_key
        ALGORITHM: HS256
        ACCESS_TOKEN_EXPIRE_MINUTES: 30

  # Tests de l'API ML
  ml-api-tests:
    name: 🤖 Tests API ML
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout du code
      uses: actions/checkout@v4
      
    - name: 🐍 Configuration Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: 📦 Installation des dépendances
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio httpx
        
    - name: 🧪 Exécution des tests API ML
      run: |
        cd ModelAi
        python -m pytest tests/ -v --tb=short
      env:
        SECRET_KEY: test_secret_key
        ALGORITHM: HS256

  # Tests d'intégration avec Docker
  docker-tests:
    name: 🐳 Tests Docker
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout du code
      uses: actions/checkout@v4
      
    - name: 🐳 Configuration Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: 🏗️ Construction de l'image Docker
      run: |
        docker build -t obesitrack:test .
        
    - name: 🧪 Tests de validation Docker
      run: |
        # Vérifier que l'image se construit correctement
        docker run --rm obesitrack:test python --version
        
        # Vérifier que les fichiers nécessaires sont présents
        docker run --rm obesitrack:test ls -la /app/
        docker run --rm obesitrack:test ls -la /app/App/Back-end/
        docker run --rm obesitrack:test ls -la /app/ModelAi/
        
    - name: 🐳 Test Docker Compose
      run: |
        # Vérifier la syntaxe du docker-compose
        docker-compose config
        
        # Test de démarrage des services (sans les volumes persistants)
        docker-compose up --build -d --remove-orphans
        sleep 30
        
        # Vérifier que les services sont en cours d'exécution
        docker-compose ps
        
        # Test de santé des services
        docker-compose exec -T obesitrack curl -f http://localhost:7777/ || echo "Service principal non accessible"
        docker-compose exec -T obesitrack curl -f http://localhost:8000/ || echo "Service ML non accessible"
        
        # Nettoyage
        docker-compose down -v

  # Tests de sécurité
  security-tests:
    name: 🔒 Tests de Sécurité
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout du code
      uses: actions/checkout@v4
      
    - name: 🐍 Configuration Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: 📦 Installation des outils de sécurité
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety
        pip install -r requirements.txt
        
    - name: 🔍 Analyse de sécurité avec Bandit
      run: |
        bandit -r App/ ModelAi/ -f json -o bandit-report.json || true
        bandit -r App/ ModelAi/ -ll
        
    - name: 🛡️ Vérification des vulnérabilités avec Safety
      run: |
        safety check --json --output safety-report.json || true
        safety check

  # Tests de performance
  performance-tests:
    name: ⚡ Tests de Performance
    runs-on: ubuntu-latest
    needs: [backend-tests, ml-api-tests]
    
    services:
      mongodb:
        image: mongo:${{ env.MONGODB_VERSION }}
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_DATABASE: obesitrack_perf_test
          
    steps:
    - name: 📥 Checkout du code
      uses: actions/checkout@v4
      
    - name: 🐍 Configuration Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: 📦 Installation des dépendances
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install locust
        
    - name: ⚡ Tests de charge avec Locust
      run: |
        cd tests/performance
        locust --headless --users 10 --spawn-rate 2 --run-time 30s --host http://localhost:7777
      env:
        MONGO_URI: mongodb://localhost:27017/obesitrack_perf_test
        DB_NAME: obesitrack_perf_test
        SECRET_KEY: test_secret_key

  # Rapport final
  test-summary:
    name: 📊 Résumé des Tests
    runs-on: ubuntu-latest
    needs: [lint, backend-tests, ml-api-tests, docker-tests, security-tests]
    if: always()
    
    steps:
    - name: 📊 Affichage du résumé
      run: |
        echo "## 🧪 Résumé des Tests ObesiTrack" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Repository:** ${{ env.REPO_URL }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Test | Statut |" >> $GITHUB_STEP_SUMMARY
        echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| 🔍 Linting | ${{ needs.lint.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| 🏥 Backend | ${{ needs.backend-tests.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| 🤖 API ML | ${{ needs.ml-api-tests.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| 🐳 Docker | ${{ needs.docker-tests.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| 🔒 Sécurité | ${{ needs.security-tests.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📋 Informations du Projet" >> $GITHUB_STEP_SUMMARY
        echo "- **Application:** ObesiTrack - Prédiction d'Obésité basée sur l'IA" >> $GITHUB_STEP_SUMMARY
        echo "- **Technologies:** FastAPI, Python, MongoDB, Docker, Scikit-Learn" >> $GITHUB_STEP_SUMMARY
        echo "- **Branche:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY