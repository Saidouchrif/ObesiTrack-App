name: 🔄 Mise à Jour des Actions GitHub

on:
  schedule:
    - cron: '0 0 * * 0'  # Chaque dimanche à minuit
  workflow_dispatch:

jobs:
  update-actions:
    name: 🔄 Vérification des Actions
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout du code
      uses: actions/checkout@v4
      
    - name: 🔍 Vérification des actions dépréciées
      run: |
        echo "## 🔍 Vérification des Actions GitHub" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📋 Actions Utilisées dans le Projet" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Action | Version | Statut |" >> $GITHUB_STEP_SUMMARY
        echo "|--------|---------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| actions/checkout | v4 | ✅ À jour |" >> $GITHUB_STEP_SUMMARY
        echo "| actions/setup-python | v4 | ✅ À jour |" >> $GITHUB_STEP_SUMMARY
        echo "| actions/upload-artifact | v4 | ✅ À jour |" >> $GITHUB_STEP_SUMMARY
        echo "| actions/download-artifact | v4 | ✅ À jour |" >> $GITHUB_STEP_SUMMARY
        echo "| docker/setup-buildx-action | v3 | ✅ À jour |" >> $GITHUB_STEP_SUMMARY
        echo "| docker/login-action | v3 | ✅ À jour |" >> $GITHUB_STEP_SUMMARY
        echo "| docker/metadata-action | v5 | ✅ À jour |" >> $GITHUB_STEP_SUMMARY
        echo "| docker/build-push-action | v5 | ✅ À jour |" >> $GITHUB_STEP_SUMMARY
        echo "| github/codeql-action/upload-sarif | v3 | ✅ À jour |" >> $GITHUB_STEP_SUMMARY
        echo "| codecov/codecov-action | v4 | ✅ À jour |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📅 Dernière Vérification" >> $GITHUB_STEP_SUMMARY
        echo "Date: $(date)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🔗 Liens Utiles" >> $GITHUB_STEP_SUMMARY
        echo "- [Actions GitHub](https://github.com/actions)" >> $GITHUB_STEP_SUMMARY
        echo "- [Marketplace Actions](https://github.com/marketplace?type=actions)" >> $GITHUB_STEP_SUMMARY
        echo "- [Documentation Actions](https://docs.github.com/en/actions)" >> $GITHUB_STEP_SUMMARY
