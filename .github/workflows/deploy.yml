name: 🚀 Déploiement - ObesiTrack

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  REPO_URL: 'https://github.com/Saidouchrif/ObesiTrack-App.git'

jobs:
  # Tests avant déploiement
  test:
    name: 🧪 Tests de Validation
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Checkout du code
      uses: actions/checkout@v4
      
    - name: 🐍 Configuration Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: 📦 Installation des dépendances
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        
    - name: 🧪 Exécution des tests
      run: |
        pytest --cov=App --cov=ModelAi --cov-report=xml
        
    - name: 📊 Upload des rapports de couverture
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  # Construction et publication de l'image Docker
  build-and-push:
    name: 🐳 Construction et Publication Docker
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
      
    steps:
    - name: 📥 Checkout du code
      uses: actions/checkout@v4
      
    - name: 🐳 Configuration Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: 🔐 Connexion au registre
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: 🏷️ Extraction des métadonnées
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest,enable={{is_default_branch}}
          
    - name: 🏗️ Construction et publication de l'image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Déploiement sur serveur de test
  deploy-staging:
    name: 🧪 Déploiement Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: staging
    
    steps:
    - name: 📥 Checkout du code
      uses: actions/checkout@v4
      
    - name: 🚀 Déploiement sur serveur de test
      run: |
        echo "Déploiement sur serveur de test..."
        echo "Repository: ${{ env.REPO_URL }}"
        echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
        # Ici vous pouvez ajouter vos commandes de déploiement
        # Par exemple : ssh, kubectl, docker-compose, etc.
        
    - name: 🧪 Tests de validation post-déploiement
      run: |
        echo "Tests de validation après déploiement..."
        # Tests de santé des services déployés

  # Déploiement en production
  deploy-production:
    name: 🚀 Déploiement Production
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-staging]
    environment: production
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: 📥 Checkout du code
      uses: actions/checkout@v4
      
    - name: 🚀 Déploiement en production
      run: |
        echo "Déploiement en production..."
        echo "Repository: ${{ env.REPO_URL }}"
        echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
        # Commandes de déploiement en production
        
    - name: 📊 Notification de déploiement
      run: |
        echo "## 🚀 Déploiement ObesiTrack Réussi" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Repository:** ${{ env.REPO_URL }}" >> $GITHUB_STEP_SUMMARY
        echo "**Image Docker:** ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
        echo "**Branche:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🎯 Services Déployés" >> $GITHUB_STEP_SUMMARY
        echo "- 🏥 API Principale (Port 7777)" >> $GITHUB_STEP_SUMMARY
        echo "- 🤖 API ML (Port 8000)" >> $GITHUB_STEP_SUMMARY
        echo "- 🗄️ MongoDB (Port 27017)" >> $GITHUB_STEP_SUMMARY
        echo "- 🌐 MongoDB Express (Port 8081)" >> $GITHUB_STEP_SUMMARY

  # Nettoyage des images anciennes
  cleanup:
    name: 🧹 Nettoyage
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: always()
    
    steps:
    - name: 🧹 Nettoyage des images Docker
      run: |
        echo "Nettoyage des images anciennes..."
        echo "Repository: ${{ env.REPO_URL }}"
        # Script de nettoyage des images Docker